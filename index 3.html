<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hot Food Manager V1.2</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:20px;background:#f5f5f5}.card{background:#fff;padding:15px;margin:12px 0;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}input,select,button,textarea{padding:8px;margin:4px}textarea{width:100%;height:220px}.g{color:green}.a{color:orange}.r{color:red}</style></head><body><h1>Hot Food Manager V1.2</h1><div class='card'><h3>Flight</h3><input id='flightNo' placeholder='Flight Number'><input id='route' placeholder='Route'><button id='saveFlight'>Save</button></div><div class='card'><h3>Food Setup</h3><input id='foodName' placeholder='Food Item'><input id='foodStock' type='number' placeholder='Stock'><button id='addFood'>Add Food</button><table><thead><tr><th>Item</th><th>Stock</th><th>Remaining</th><th></th></tr></thead><tbody id='foodTable'></tbody></table></div><div class='card'><h3>Add Order</h3><input id='seat' placeholder='12A'><select id='foodSelect'></select><input id='qty' type='number' value='1' min='1'><button id='addOrder'>Add Order</button></div><div class='card'><h3>Passenger Summary</h3><div id='summary'></div></div><div class='card'><h3>Cook Totals</h3><div id='cookTotals'></div></div><div class='card'><h3>Zone Report</h3><textarea id='zoneReport' readonly></textarea></div><script>let foods=JSON.parse(localStorage.getItem('foods')||'[]');let orders=JSON.parse(localStorage.getItem('orders')||'[]');const $=id=>document.getElementById(id);function save(){localStorage.setItem('foods',JSON.stringify(foods));localStorage.setItem('orders',JSON.stringify(orders));}function remaining(id){const f=foods.find(x=>x.id===id);if(!f)return 0;return f.stock-orders.filter(o=>o.itemId===id).reduce((a,b)=>a+b.qty,0);}function render(){let ft=$('foodTable');let fs=$('foodSelect');ft.innerHTML='';fs.innerHTML='<option value="">Select food</option>';foods.forEach(f=>{ft.innerHTML+=`<tr><td>${f.name}</td><td>${f.stock}</td><td>${remaining(f.id)}</td><td><button onclick="removeFood('${f.id}')">Delete</button></td></tr>`;fs.innerHTML+=`<option value="${f.id}">${f.name}</option>`});let grouped={},totals={};orders.forEach(o=>{let f=foods.find(x=>x.id===o.itemId);if(!f)return;(grouped[o.seat]=grouped[o.seat]||[]).push(f.name+' x'+o.qty);totals[f.name]=(totals[f.name]||0)+o.qty;});$('summary').innerHTML=Object.keys(grouped).sort().map(s=>'<p><b>'+s+'</b><br>'+grouped[s].join('<br>')+'</p>').join('');$('cookTotals').innerHTML=Object.keys(totals).map(k=>k+' x '+totals[k]).join('<br>');let A=[],B=[],C=[],D=[];Object.keys(grouped).forEach(seat=>{let row=parseInt(seat)||0;let line=seat+' - '+grouped[seat].join(', ');if(row<=10)A.push(line);else if(row<=20)B.push(line);else if(row<=30)C.push(line);else D.push(line);});$('zoneReport').value='ZONE A
'+A.join('
')+'

ZONE B
'+B.join('
')+'

ZONE C
'+C.join('
')+'

ZONE D
'+D.join('
');save();}window.removeFood=function(id){foods=foods.filter(f=>f.id!==id);orders=orders.filter(o=>o.itemId!==id);render();};$('addFood').onclick=()=>{let n=$('foodName').value.trim();let s=parseInt($('foodStock').value);if(!n||isNaN(s)) {alert('Enter food and stock');return;} foods.push({id:'F'+Date.now(),name:n,stock:s});$('foodName').value='';$('foodStock').value='';render();};$('addOrder').onclick=()=>{let seat=$('seat').value.trim().toUpperCase();let itemId=$('foodSelect').value;let qty=parseInt($('qty').value)||1;if(!seat||!itemId){alert('Select seat and food');return;} if(qty>remaining(itemId)){alert('Not enough stock');return;} let ex=orders.find(o=>o.seat===seat&&o.itemId===itemId); if(ex) ex.qty+=qty; else orders.push({seat,itemId,qty}); $('seat').value=''; render();};$('saveFlight').onclick=()=>{localStorage.setItem('flightNo',$('flightNo').value);localStorage.setItem('route',$('route').value);};$('flightNo').value=localStorage.getItem('flightNo')||'';$('route').value=localStorage.getItem('route')||'';render();</script></body></html>
