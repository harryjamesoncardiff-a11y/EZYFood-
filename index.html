<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Food Manager V1.1</title>
<style>
body{font-family:Arial,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#f5f5f5}
.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px}
input,select,button,textarea{padding:8px;margin:4px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}
.green{color:green;font-weight:bold}.amber{color:orange;font-weight:bold}.red{color:red;font-weight:bold}
textarea{width:100%;height:220px}
</style>
</head>
<body>
<h1>🍔 Hot Food Manager V1.1</h1>
<div class='card'>
<h2>Flight Details</h2>
<input id='flightNo' placeholder='Flight Number'>
<input id='route' placeholder='Route'>
<button onclick='saveFlight()'>Save</button>
</div>
<div class='card'>
<h2>Food Menu</h2>
<input id='foodName' placeholder='Food Item'>
<input id='foodStock' type='number' placeholder='Opening Stock'>
<button onclick='addFood()'>Add Food</button>
<table><thead><tr><th>Item</th><th>Opening Stock</th><th>Remaining</th><th>Delete</th></tr></thead><tbody id='foodTable'></tbody></table>
</div>
<div class='card'>
<h2>Add Order</h2>
<input id='seat' placeholder='Seat e.g. 12A'>
<select id='foodSelect'></select>
<input id='qty' type='number' min='1' value='1'>
<button onclick='addOrder()'>Add Order</button>
</div>
<div class='card'>
<h2>Passenger Summary</h2>
<div id='summary'></div>
</div>
<div class='card'>
<h2>Cook Off Totals</h2>
<div id='cookTotals'></div>
</div>
<div class='card'>
<h2>Stock Levels</h2>
<div id='stockLevels'></div>
</div>
<div class='card'>
<h2>Zone Report</h2>
<textarea id='zoneReport' readonly></textarea><br>
<button onclick='copyReport()'>Copy Report</button>
</div>
<script>
let foods=JSON.parse(localStorage.getItem('foods')||'[]');
let orders=JSON.parse(localStorage.getItem('orders')||'[]');
flightNo.value=localStorage.getItem('flightNo')||'';
route.value=localStorage.getItem('route')||'';
function save(){localStorage.setItem('foods',JSON.stringify(foods));localStorage.setItem('orders',JSON.stringify(orders));}
function saveFlight(){localStorage.setItem('flightNo',flightNo.value);localStorage.setItem('route',route.value);render();}
function remaining(id){const f=foods.find(x=>x.id===id);if(!f)return 0;const sold=orders.filter(o=>o.itemId===id).reduce((a,b)=>a+b.qty,0);return f.stock-sold;}
function addFood(){const n=foodName.value.trim();const s=parseInt(foodStock.value);if(!n||isNaN(s)) return;foods.push({id:Date.now()+Math.random(),name:n,stock:s});foodName.value='';foodStock.value='';save();render();}
function deleteFood(id){foods=foods.filter(f=>f.id!==id);orders=orders.filter(o=>o.itemId!==id);save();render();}
function addOrder(){const seatVal=seat.value.trim().toUpperCase();const itemId=Number(foodSelect.value);const q=parseInt(qty.value)||1;if(!seatVal||!itemId)return; if(q>remaining(itemId)){alert('Not enough stock');return;} let existing=orders.find(o=>o.seat===seatVal&&o.itemId===itemId); if(existing){existing.qty+=q;} else {orders.push({seat:seatVal,itemId:itemId,qty:q});} seat.value=''; qty.value=1; save(); render();}
function copyReport(){navigator.clipboard.writeText(zoneReport.value);alert('Copied');}
function render(){foodTable.innerHTML=''; foodSelect.innerHTML='<option value="">Select Food</option>'; foods.forEach(f=>{foodTable.innerHTML+=`<tr><td>${f.name}</td><td>${f.stock}</td><td>${remaining(f.id)}</td><td><button onclick="deleteFood(${f.id})">X</button></td></tr>`; foodSelect.innerHTML+=`<option value="${f.id}">${f.name}</option>`;});
let grouped={}; let totals={}; orders.forEach(o=>{const f=foods.find(x=>x.id===o.itemId); if(!f)return; if(!grouped[o.seat]) grouped[o.seat]=[]; grouped[o.seat].push(`${f.name} x${o.qty}`); totals[f.name]=(totals[f.name]||0)+o.qty;});
summary.innerHTML=Object.keys(grouped).sort().map(s=>`<p><b>${s}</b><br>${grouped[s].join('<br>')}</p>`).join('');
cookTotals.innerHTML=Object.keys(totals).length?Object.keys(totals).map(k=>`${k} x ${totals[k]}`).join('<br>'):'No orders';
stockLevels.innerHTML=foods.map(f=>{let r=remaining(f.id);let c=r<=2?'red':r<=5?'amber':'green';return `<div class="${c}">${f.name}: ${r} remaining</div>`}).join('');
let A=[],B=[],C=[],D=[]; Object.keys(grouped).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(seat=>{let row=parseInt(seat);let line=`${seat} - ${grouped[seat].join(', ')}`; if(row<=10)A.push(line); else if(row<=20)B.push(line); else if(row<=30)C.push(line); else D.push(line);});
zoneReport.value=`FLIGHT: ${flightNo.value}
ROUTE: ${route.value}

ZONE A (1-10)
${A.join('
')}

ZONE B (11-20)
${B.join('
')}

ZONE C (21-30)
${C.join('
')}

ZONE D (31-40)
${D.join('
')}`;
}
render();
</script>
</body></html>
